<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: #7d8590; stroke-width: 1.5; rx: 8; }
    .open { stroke: #2f81f7; }
    .locked { stroke: #7d8590; stroke-dasharray: 5 4; }
    .title { font-size: 15px; font-weight: 600; fill: #7d8590; }
    .head { font-size: 12.5px; font-weight: 700; fill: #2f81f7; }
    .headmuted { font-size: 12.5px; font-weight: 700; fill: #8b949e; }
    .item { font-size: 12px; fill: #8b949e; }
    .note { font-size: 11.5px; fill: #8b949e; }
  </style>

  <text x="20" y="26" class="title">What it can see</text>

  <rect x="20" y="44" width="350" height="200" class="box open"/>
  <text x="38" y="70" class="head">NO LOGIN — just a team ID</text>
  <text x="38" y="98" class="item">Every player: form, xG, xA, minutes, price</text>
  <text x="38" y="120" class="item">Who takes penalties and corners</text>
  <text x="38" y="142" class="item">Fixtures and difficulty, blanks and doubles</text>
  <text x="38" y="164" class="item">Any team's squad from finished gameweeks</text>
  <text x="38" y="186" class="item">Mini-league tables, rivals' transfers</text>
  <text x="38" y="208" class="item">Live scores, price changes, dream team</text>
  <text x="38" y="232" class="note">Enough to argue about your team all week.</text>

  <rect x="392" y="44" width="348" height="200" class="box locked"/>
  <text x="410" y="70" class="headmuted">YOUR LOGIN — your own copy only</text>
  <text x="410" y="98" class="item">This gameweek's squad, before it locks</text>
  <text x="410" y="120" class="item">Your selling prices and bank</text>
  <text x="410" y="142" class="item">Free transfers and chips remaining</text>
  <text x="410" y="176" class="note">Requires running the server yourself, on</text>
  <text x="410" y="194" class="note">your own machine, with your own</text>
  <text x="410" y="212" class="note">credentials. Never send these to someone</text>
  <text x="410" y="230" class="note">else's hosted server.</text>

  <text x="20" y="278" class="note">A team ID is not a secret — it is already in the URL everyone in your mini-league can see.</text>
</svg>
